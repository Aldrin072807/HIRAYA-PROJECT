{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HIRAYA</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>

        /* =========================================
           HIRAYA COLORS
        ========================================== */

        :root {
            --dark-brown: #3b2a20;
            --brown: #574235;
            --light-brown: #76675d;

            --gold: #c99750;
            --light-gold: #e7bd80;

            --cream: #ead0aa;
            --navbar-cream: #f3e3cc;
            --light-cream: #fbf5ec;

            --white: #fffaf4;

            --error-red: #b94a48;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {
            font-family: "Montserrat", sans-serif;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    90deg,
                    rgba(50, 37, 28, 0.82) 0%,
                    rgba(58, 44, 35, 0.62) 50%,
                    rgba(58, 44, 35, 0.30) 100%
                ),
                url("{% static 'assets/img/bg-masthead.jpg' %}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }



        /* =========================================
           NAVBAR
        ========================================== */

        .navbar {
            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;

            background: var(--navbar-cream);

            border-bottom: 1px solid rgba(59, 42, 32, 0.15);

            box-shadow: 0 2px 12px rgba(59, 42, 32, 0.08);

            padding: 0 6%;

            position: relative;

            z-index: 10;
        }


        .back-home {
            color: var(--dark-brown);

            font-size: 0.78rem;

            font-weight: 600;

            letter-spacing: 1.5px;

            text-decoration: none;

            transition: 0.25s ease;
        }


        .back-home:hover {
            color: var(--gold);
        }


        .logo-link {
            margin-left: auto;

            display: flex;
            align-items: center;

            text-decoration: none;
        }


        .navbar-logo {
            display: block;

            width: 220px;
            height: 68px;

            object-fit: contain;

            transition: 0.3s ease;
        }


        .navbar-logo:hover {
            transform: scale(1.03);
        }



        /* =========================================
           LOGIN AREA
        ========================================== */

        .login-wrapper {
            flex: 1;

            width: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 60px 20px;
        }



        /* =========================================
           LOGIN CARD
        ========================================== */

        .login-card {
            width: 100%;

            max-width: 440px;

            padding: 45px 42px;

            background: rgba(255, 250, 244, 0.96);

            border: 1px solid rgba(59, 42, 32, 0.12);

            border-radius: 8px;

            box-shadow: 0 20px 50px rgba(40, 27, 19, 0.25);
        }



        /* =========================================
           CARD HEADER
        ========================================== */

        .card-decoration {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 15px;
        }


        .decoration-line {
            width: 35px;
            height: 1px;

            background: var(--gold);
        }


        .decoration-star {
            color: var(--gold);

            font-size: 0.8rem;
        }


        .login-card h1 {
            margin: 0;

            font-family: "Cormorant Garamond", serif;

            font-size: 2.6rem;

            font-weight: 600;

            color: var(--dark-brown);

            text-align: center;
        }


        .login-subtitle {
            margin: 10px 0 32px;

            color: var(--light-brown);

            font-size: 0.82rem;

            line-height: 1.7;

            text-align: center;
        }



        /* =========================================
           ERROR MESSAGE
        ========================================== */

        .error-message {
            margin-bottom: 22px;

            padding: 12px 14px;

            background: rgba(185, 74, 72, 0.08);

            border: 1px solid rgba(185, 74, 72, 0.25);

            border-radius: 4px;

            color: var(--error-red);

            font-size: 0.78rem;

            line-height: 1.5;

            text-align: center;
        }



        /* =========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: var(--brown);

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.8px;

            text-transform: uppercase;
        }


        input[type="email"],
        input[type="password"] {
            width: 100%;

            padding: 13px 14px;

            background: var(--white);

            border: 1px solid rgba(59, 42, 32, 0.22);

            border-radius: 4px;

            color: var(--dark-brown);

            font-family: "Montserrat", sans-serif;

            font-size: 0.86rem;

            transition: 0.25s ease;
        }


        input::placeholder {
            color: #a79a90;
        }


        input:focus {
            outline: none;

            border-color: var(--gold);

            box-shadow: 0 0 0 3px rgba(201, 151, 80, 0.12);
        }



        /* =========================================
           LOGIN BUTTON
        ========================================== */

        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px 20px;

            background: var(--gold);

            border: 1px solid var(--gold);

            border-radius: 4px;

            color: var(--dark-brown);

            font-family: "Montserrat", sans-serif;

            font-size: 0.76rem;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .login-button:hover {
            background: var(--cream);

            border-color: var(--cream);

            transform: translateY(-2px);
        }



        /* =========================================
           REGISTER LINK
        ========================================== */

        .register-section {
            margin-top: 27px;

            padding-top: 23px;

            border-top: 1px solid rgba(59, 42, 32, 0.12);

            color: var(--light-brown);

            font-size: 0.78rem;

            text-align: center;
        }


        .register-section a {
            color: var(--gold);

            font-weight: 600;

            text-decoration: none;
        }


        .register-section a:hover {
            color: var(--dark-brown);
        }



        /* =========================================
           FOOTER
        ========================================== */

        .footer {
            width: 100%;

            padding: 18px 20px;

            background: var(--navbar-cream);

            border-top: 1px solid rgba(59, 42, 32, 0.15);

            color: var(--dark-brown);

            font-size: 0.68rem;

            font-weight: 500;

            letter-spacing: 0.5px;

            text-align: center;
        }



        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .navbar {
                height: 70px;
                padding: 0 20px;
            }


            .navbar-logo {
                width: 155px;
                height: 55px;
            }


            .back-home {
                font-size: 0.68rem;
            }


            .login-wrapper {
                padding: 35px 18px;
            }


            .login-card {
                padding: 35px 25px;
            }


            .login-card h1 {
                font-size: 2.2rem;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">


        <!-- HOME -->

        <a href="/" class="back-home">
            ← HOME
        </a>


        <!-- HIRAYA LOGO -->

        <a href="/" class="logo-link">

            <img
                src="/static/assets/img/hiraya-logo.png"
                class="navbar-logo"
                alt="HIRAYA">

        </a>


    </nav>



    <!-- =========================================
         LOGIN AREA
    ========================================== -->

    <main class="login-wrapper">


        <div class="login-card">


            <!-- DECORATION -->

            <div class="card-decoration">

                <div class="decoration-line"></div>

                <span class="decoration-star">
                    ✦
                </span>

                <div class="decoration-line"></div>

            </div>



            <!-- TITLE -->

            <h1>
                 Login to HIRAYA
            </h1>


            <p class="login-subtitle">
                Sign in to continue your journey with HIRAYA.
            </p>



            <!-- ERROR MESSAGE -->

            {% if error %}

                <div class="error-message">

                    Invalid email address or password.
                    Please try again.

                </div>

            {% endif %}



            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{% url 'profiles:login' %}">


                {% csrf_token %}



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                        autofocus>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    Log In

                </button>


            </form>



            <!-- REGISTER -->

            <div class="register-section">

                Don't have an account?

                <a href="{% url 'profiles:register' %}">
                    Register here
                </a>

            </div>


        </div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

        Copyright &copy; HIRAYA 2026.
        All rights reserved.

    </footer>


</body>

</html>
