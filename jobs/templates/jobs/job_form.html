<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Job Form" }} | HIRAYA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --input-bg: #0f172a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 3rem 1rem;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        h1 { margin: 0; font-size: 1.8rem; }
        .btn-link {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-link:hover { background-color: var(--accent-hover); color: #ffffff; }
        form p { margin-bottom: 1.2rem; }
        form label { display: block; margin-bottom: 0.4rem; color: var(--accent-blue); font-weight: 600; }
        form input, form textarea, form select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-meta">
            <h1>{{ title|default:"Add Job Posting" }}</h1>
            <a href="{% url dashboard_url %}" class="btn-link">&larr; Back to Dashboard</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn-link">Save Job Posting</button>
            </div>
        </form>
    </div>
</body>
</html>
