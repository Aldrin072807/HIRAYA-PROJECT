<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview | HIRAYA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--text-main);
        }
        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
            text-decoration: none;
            box-sizing: border-box;
            display: block;
        }
        .btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background-color: var(--border-color);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ready for your Mock Interview?</h1>
        <p>You will be presented with timed technical and behavioral questions. Your responses will be logged for review upon completion.</p>
        <form method="POST" action="{% url 'interviews:start_interview' %}">
            {% csrf_token %}
            {% if job %}
                <input type="hidden" name="job_id" value="{{ job.id }}">
            {% endif %}
            <div class="btn-group">
                <button type="submit" class="btn">Start Interview Session</button>
                <a href="{% if dashboard_url %}{% url dashboard_url %}{% else %}{% url 'profiles:student_dashboard' %}{% endif %}" class="btn btn-secondary">&larr; Back to Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
