<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question {{ question.id }} | HIRAYA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --input-bg: #0f172a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .timer {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f43f5e;
        }
        .question-text {
            font-size: 1.25rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 1rem;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 1.5rem;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }
        .btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-meta">
            <span class="badge">{{ question.category|default:"General" }}</span>
            <span class="timer" id="timer">Time Remaining: 02:00</span>
        </div>
        
        <div class="question-text">
            {{ question.text }}
        </div>

        <form id="interview-form" method="POST">
            {% csrf_token %}
            <textarea name="answer" placeholder="Type your detailed answer here..." required></textarea>
            <button type="submit" class="btn">Submit Answer</button>
        </form>
    </div>

    <script>
        let timeRemaining = 120; 
        const timerDisplay = document.getElementById('timer');
        const form = document.getElementById('interview-form');

        const countdown = setInterval(() => {
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `Time Remaining: ${minutes}:${seconds}`;

            if (timeRemaining <= 0) {
                clearInterval(countdown);
                const textarea = document.querySelector('textarea[name="answer"]');
                if (textarea) textarea.removeAttribute('required');
                form.submit();
            }

            timeRemaining--;
        }, 1000);
    </script>
</body>
</html>
